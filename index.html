<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: Arial, sans-serif;
        }
        #game-container {
            text-align: center;
        }
        canvas {
            background: linear-gradient(180deg, #0a0a15 0%, #1a1a30 100%);
            display: block;
            margin: 0 auto;
            border: 2px solid #333;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }
        #score {
            color: #0ff;
            font-size: 28px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }
        #stats {
            color: #888;
            font-size: 14px;
            margin-bottom: 5px;
        }
        #bonus {
            color: #ff0;
            font-size: 18px;
            height: 24px;
            margin-bottom: 5px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        #bonus.show {
            opacity: 1;
        }
        #instructions {
            color: #666;
            font-size: 14px;
            margin-top: 10px;
        }
        #canvas-wrapper {
            position: relative;
            display: inline-block;
        }
        #mickey {
            position: absolute;
            left: -50px;
            width: 45px;
            height: auto;
            pointer-events: none;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            z-index: 10;
        }
        .overlay h1 {
            font-size: 48px;
            margin: 0 0 20px 0;
            color: #0ff;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
        }
        .overlay h2 {
            font-size: 32px;
            margin: 0 0 15px 0;
            color: #ff0;
        }
        .overlay p {
            font-size: 18px;
            margin: 10px 0;
            color: #aaa;
        }
        .overlay .start-msg {
            font-size: 22px;
            color: #0f0;
            margin-top: 30px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .high-scores {
            margin-top: 20px;
            text-align: left;
        }
        .high-scores h3 {
            color: #0ff;
            margin-bottom: 10px;
            text-align: center;
        }
        .high-scores ol {
            padding-left: 30px;
            margin: 0;
        }
        .high-scores li {
            color: #ccc;
            margin: 5px 0;
            font-size: 16px;
        }
        .power-up-status {
            position: absolute;
            top: 10px;
            right: 10px;
            text-align: right;
        }
        .power-up-active {
            color: #0f0;
            font-size: 12px;
            margin: 2px 0;
        }
        #high-score-display {
            color: #f0f;
            font-size: 14px;
            margin-bottom: 5px;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="bonus"></div>
        <div id="high-score-display">High Score: 0</div>
        <div id="score">Score: 0</div>
        <div id="stats">Speed: 1.0x | Rally: 0</div>
        <div id="canvas-wrapper">
            <img id="mickey" src="image/OIP.webp" alt="Mickey">
            <canvas id="pong" width="600" height="400"></canvas>

            <!-- Start Screen Overlay -->
            <div id="start-overlay" class="overlay">
                <h1>PONG</h1>
                <p>Use mouse or arrow keys to move</p>
                <p>Collect power-ups for bonuses!</p>
                <div class="high-scores" id="start-high-scores"></div>
                <p class="start-msg">Press SPACE to Start</p>
            </div>

            <!-- Pause Overlay -->
            <div id="pause-overlay" class="overlay hidden">
                <h1>PAUSED</h1>
                <p class="start-msg">Press SPACE to Resume</p>
            </div>

            <!-- Game Over Overlay -->
            <div id="gameover-overlay" class="overlay hidden">
                <h2>GAME OVER</h2>
                <p id="final-score">Final Score: 0</p>
                <div class="high-scores" id="gameover-high-scores"></div>
                <p class="start-msg">Press SPACE to Play Again</p>
            </div>

            <div class="power-up-status" id="power-up-status"></div>
        </div>
        <div id="instructions">Use mouse or arrow keys | SPACE to pause</div>
    </div>

    <script>
        const canvas = document.getElementById('pong');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const statsDisplay = document.getElementById('stats');
        const bonusDisplay = document.getElementById('bonus');
        const mickeyImg = document.getElementById('mickey');
        const highScoreDisplay = document.getElementById('high-score-display');
        const startOverlay = document.getElementById('start-overlay');
        const pauseOverlay = document.getElementById('pause-overlay');
        const gameoverOverlay = document.getElementById('gameover-overlay');
        const finalScoreDisplay = document.getElementById('final-score');
        const powerUpStatusDisplay = document.getElementById('power-up-status');

        // Audio context for sounds
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(freq, duration, type = 'square') {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playHitSound() { playSound(440, 0.1); }
        function playWallSound() { playSound(220, 0.1); }
        function playScoreSound() { playSound(880, 0.15, 'sine'); }
        function playGameOverSound() {
            playSound(200, 0.3);
            setTimeout(() => playSound(150, 0.3), 150);
            setTimeout(() => playSound(100, 0.5), 300);
        }
        function playPowerUpSound() {
            playSound(523, 0.1, 'sine');
            setTimeout(() => playSound(659, 0.1, 'sine'), 100);
            setTimeout(() => playSound(784, 0.15, 'sine'), 200);
        }

        // High scores
        function getHighScores() {
            const scores = localStorage.getItem('pongHighScores');
            return scores ? JSON.parse(scores) : [];
        }

        function saveHighScore(newScore) {
            let scores = getHighScores();
            scores.push(newScore);
            scores.sort((a, b) => b - a);
            scores = scores.slice(0, 5);
            localStorage.setItem('pongHighScores', JSON.stringify(scores));
            return scores;
        }

        function displayHighScores(containerId) {
            const container = document.getElementById(containerId);
            const scores = getHighScores();
            if (scores.length === 0) {
                container.innerHTML = '<h3>High Scores</h3><p style="color:#666">No scores yet!</p>';
            } else {
                container.innerHTML = '<h3>High Scores</h3><ol>' +
                    scores.map(s => `<li>${s}</li>`).join('') + '</ol>';
            }
        }

        function updateHighScoreDisplay() {
            const scores = getHighScores();
            const high = scores.length > 0 ? scores[0] : 0;
            highScoreDisplay.textContent = 'High Score: ' + high;
        }

        // Game constants
        const paddleWidth = 12;
        const basePaddleHeight = 80;
        const ballSize = 10;
        const baseSpeed = 4;
        const speedMultiplierIncrease = 1.05;
        const maxSpeedMultiplier = 2.5;

        // Game state
        let gameState = 'menu'; // 'menu', 'playing', 'paused', 'gameover'
        let score = 0;
        let rallyCount = 0;
        let speedMultiplier = 1.0;

        // Power-up state
        const powerUps = [];
        const activePowerUps = {
            bigPaddle: { active: false, endTime: 0 },
            slowMotion: { active: false, endTime: 0 },
            shield: { active: false, count: 0 }
        };
        const extraBalls = [];
        let powerUpSpawnTimer = 0;

        // Player paddle
        const player = {
            x: 20,
            y: canvas.height / 2 - basePaddleHeight / 2,
            width: paddleWidth,
            height: basePaddleHeight,
            dy: 0,
            prevY: canvas.height / 2 - basePaddleHeight / 2,
            velocity: 0
        };

        // Ball
        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            size: ballSize,
            dx: baseSpeed,
            dy: 3,
            spin: 0
        };

        // Particle trail
        const particles = [];
        const maxParticles = 20;

        // Wall (right side)
        const wall = {
            x: canvas.width - 20,
            y: 0,
            width: 10,
            height: canvas.height
        };

        // Power-up types
        const powerUpTypes = [
            { type: 'bigPaddle', color: '#00ff00', label: 'BIG' },
            { type: 'slowMotion', color: '#00aaff', label: 'SLOW' },
            { type: 'multiBall', color: '#ffff00', label: 'x2' },
            { type: 'shield', color: '#ff00ff', label: 'SHIELD' }
        ];

        function spawnPowerUp() {
            const type = powerUpTypes[Math.floor(Math.random() * powerUpTypes.length)];
            powerUps.push({
                x: canvas.width + 20,
                y: 50 + Math.random() * (canvas.height - 100),
                size: 15,
                dx: -2,
                ...type
            });
        }

        function updatePowerUps() {
            const now = Date.now();

            // Spawn new power-ups
            powerUpSpawnTimer++;
            if (powerUpSpawnTimer > 300 && Math.random() < 0.01) {
                spawnPowerUp();
                powerUpSpawnTimer = 0;
            }

            // Move power-ups
            for (let i = powerUps.length - 1; i >= 0; i--) {
                powerUps[i].x += powerUps[i].dx;

                // Check collision with paddle
                if (powerUps[i].x < player.x + player.width + powerUps[i].size &&
                    powerUps[i].x > player.x - powerUps[i].size &&
                    powerUps[i].y > player.y - powerUps[i].size &&
                    powerUps[i].y < player.y + player.height + powerUps[i].size) {

                    activatePowerUp(powerUps[i].type);
                    playPowerUpSound();
                    powerUps.splice(i, 1);
                    continue;
                }

                // Remove if off screen
                if (powerUps[i].x < -20) {
                    powerUps.splice(i, 1);
                }
            }

            // Update active power-ups
            if (activePowerUps.bigPaddle.active && now > activePowerUps.bigPaddle.endTime) {
                activePowerUps.bigPaddle.active = false;
                player.height = basePaddleHeight;
            }
            if (activePowerUps.slowMotion.active && now > activePowerUps.slowMotion.endTime) {
                activePowerUps.slowMotion.active = false;
            }

            // Update extra balls
            for (let i = extraBalls.length - 1; i >= 0; i--) {
                const eb = extraBalls[i];
                eb.x += eb.dx * getEffectiveSpeedMultiplier();
                eb.y += eb.dy;

                // Wall collisions
                if (eb.y - eb.size < 0 || eb.y + eb.size > canvas.height) {
                    eb.dy *= -1;
                }
                if (eb.x + eb.size > wall.x) {
                    eb.dx = -Math.abs(eb.dx);
                }

                // Paddle collision
                if (eb.x - eb.size < player.x + player.width &&
                    eb.x + eb.size > player.x &&
                    eb.y > player.y &&
                    eb.y < player.y + player.height &&
                    eb.dx < 0) {
                    eb.dx = Math.abs(eb.dx);
                    score += 1;
                    playHitSound();
                }

                // Remove if off screen
                if (eb.x < -eb.size) {
                    extraBalls.splice(i, 1);
                }
            }

            updatePowerUpStatus();
        }

        function activatePowerUp(type) {
            const now = Date.now();
            switch(type) {
                case 'bigPaddle':
                    activePowerUps.bigPaddle.active = true;
                    activePowerUps.bigPaddle.endTime = now + 10000;
                    player.height = basePaddleHeight * 1.5;
                    break;
                case 'slowMotion':
                    activePowerUps.slowMotion.active = true;
                    activePowerUps.slowMotion.endTime = now + 5000;
                    break;
                case 'multiBall':
                    extraBalls.push({
                        x: ball.x,
                        y: ball.y,
                        size: ballSize,
                        dx: ball.dx,
                        dy: -ball.dy
                    });
                    break;
                case 'shield':
                    activePowerUps.shield.active = true;
                    activePowerUps.shield.count++;
                    break;
            }
        }

        function getEffectiveSpeedMultiplier() {
            let mult = speedMultiplier;
            if (activePowerUps.slowMotion.active) mult *= 0.5;
            return mult;
        }

        function updatePowerUpStatus() {
            const now = Date.now();
            let html = '';
            if (activePowerUps.bigPaddle.active) {
                const remaining = Math.ceil((activePowerUps.bigPaddle.endTime - now) / 1000);
                html += `<div class="power-up-active" style="color:#00ff00">BIG PADDLE ${remaining}s</div>`;
            }
            if (activePowerUps.slowMotion.active) {
                const remaining = Math.ceil((activePowerUps.slowMotion.endTime - now) / 1000);
                html += `<div class="power-up-active" style="color:#00aaff">SLOW MO ${remaining}s</div>`;
            }
            if (activePowerUps.shield.active) {
                html += `<div class="power-up-active" style="color:#ff00ff">SHIELD x${activePowerUps.shield.count}</div>`;
            }
            powerUpStatusDisplay.innerHTML = html;
        }

        function drawPowerUps() {
            powerUps.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#000';
                ctx.font = 'bold 10px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(p.label, p.x, p.y);
            });

            // Draw extra balls
            extraBalls.forEach(eb => {
                ctx.fillStyle = '#ffff00';
                ctx.beginPath();
                ctx.arc(eb.x, eb.y, eb.size, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        // Get ball color based on speed
        function getBallColor() {
            const normalizedSpeed = Math.min((speedMultiplier - 1) / (maxSpeedMultiplier - 1), 1);

            if (normalizedSpeed < 0.33) {
                const t = normalizedSpeed / 0.33;
                return `rgb(255, 255, ${Math.round(255 - t * 255)})`;
            } else if (normalizedSpeed < 0.66) {
                const t = (normalizedSpeed - 0.33) / 0.33;
                return `rgb(255, ${Math.round(255 - t * 100)}, 0)`;
            } else {
                const t = (normalizedSpeed - 0.66) / 0.34;
                return `rgb(255, ${Math.round(155 - t * 155)}, 0)`;
            }
        }

        function getSpinColor() {
            if (Math.abs(ball.spin) < 0.1) return getBallColor();
            return ball.spin > 0 ? '#ff6b6b' : '#6bcfff';
        }

        function addParticle() {
            if (particles.length >= maxParticles) {
                particles.shift();
            }
            particles.push({
                x: ball.x,
                y: ball.y,
                size: ball.size * 0.8,
                alpha: 0.6,
                color: getSpinColor()
            });
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].alpha -= 0.04;
                particles[i].size *= 0.95;
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }

        function drawPaddle() {
            const gradient = ctx.createLinearGradient(player.x, player.y, player.x + player.width, player.y);
            gradient.addColorStop(0, activePowerUps.bigPaddle.active ? '#00ff00' : '#00ffff');
            gradient.addColorStop(1, activePowerUps.bigPaddle.active ? '#00aa00' : '#0066ff');
            ctx.fillStyle = gradient;
            ctx.fillRect(player.x, player.y, player.width, player.height);

            ctx.shadowColor = activePowerUps.bigPaddle.active ? '#00ff00' : '#00ffff';
            ctx.shadowBlur = 15;
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.shadowBlur = 0;

            // Draw shield indicator
            if (activePowerUps.shield.active) {
                ctx.strokeStyle = '#ff00ff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(5, 0);
                ctx.lineTo(5, canvas.height);
                ctx.stroke();
            }
        }

        function updateMickeyPosition() {
            const mickeyHeight = mickeyImg.offsetHeight || 60;
            mickeyImg.style.top = (player.y + player.height / 2 - mickeyHeight / 2) + 'px';
        }

        function drawBall() {
            const color = getBallColor();
            ctx.shadowColor = color;
            ctx.shadowBlur = 20;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function drawWall() {
            const gradient = ctx.createLinearGradient(wall.x, 0, wall.x + wall.width, 0);
            gradient.addColorStop(0, '#444');
            gradient.addColorStop(1, '#666');
            ctx.fillStyle = gradient;
            ctx.fillRect(wall.x, wall.y, wall.width, wall.height);
        }

        function drawCenterLine() {
            ctx.strokeStyle = '#333';
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function calculateHitScore() {
            let points = 1;
            let bonuses = [];

            if (speedMultiplier >= 1.5) {
                const speedBonus = Math.min(Math.floor((speedMultiplier - 1) * 3), 3);
                points += speedBonus;
                bonuses.push(`Speed +${speedBonus}`);
            }

            const hitPos = (ball.y - player.y) / player.height;
            if (hitPos < 0.2 || hitPos > 0.8) {
                points += 2;
                bonuses.push('Edge +2');
            }

            if (Math.abs(ball.spin) > 0.3) {
                points += 2;
                bonuses.push('Spin +2');
            }

            if (rallyCount > 0 && rallyCount % 5 === 0) {
                points += 1;
                bonuses.push('Rally +1');
            }

            if (bonuses.length > 0) {
                showBonus(bonuses.join(' | '));
                playScoreSound();
            }

            return points;
        }

        function showBonus(text) {
            bonusDisplay.textContent = text;
            bonusDisplay.classList.add('show');
            setTimeout(() => {
                bonusDisplay.classList.remove('show');
            }, 1000);
        }

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.dx = baseSpeed;
            ball.dy = 3 * (Math.random() > 0.5 ? 1 : -1);
            ball.spin = 0;
            speedMultiplier = 1.0;
            rallyCount = 0;
            particles.length = 0;
        }

        function resetGame() {
            score = 0;
            resetBall();
            player.height = basePaddleHeight;
            player.y = canvas.height / 2 - player.height / 2;
            powerUps.length = 0;
            extraBalls.length = 0;
            activePowerUps.bigPaddle.active = false;
            activePowerUps.slowMotion.active = false;
            activePowerUps.shield.active = false;
            activePowerUps.shield.count = 0;
            powerUpSpawnTimer = 0;
            scoreDisplay.textContent = 'Score: 0';
            statsDisplay.textContent = 'Speed: 1.0x | Rally: 0';
            updateHighScoreDisplay();
        }

        function gameOver() {
            playGameOverSound();
            saveHighScore(score);
            finalScoreDisplay.textContent = 'Final Score: ' + score;
            displayHighScores('gameover-high-scores');
            gameState = 'gameover';
            gameoverOverlay.classList.remove('hidden');
        }

        function update() {
            if (gameState !== 'playing') return;

            player.velocity = player.y - player.prevY;
            player.prevY = player.y;
            player.y += player.dy;

            if (player.y < 0) player.y = 0;
            if (player.y + player.height > canvas.height) {
                player.y = canvas.height - player.height;
            }

            ball.dy += ball.spin * 0.1;
            ball.spin *= 0.98;

            const effSpeed = getEffectiveSpeedMultiplier();
            ball.x += ball.dx * effSpeed;
            ball.y += ball.dy;

            addParticle();
            updateParticles();
            updatePowerUps();

            // Ball collision with top/bottom walls
            if (ball.y - ball.size < 0) {
                ball.y = ball.size;
                ball.dy = Math.abs(ball.dy);
                playWallSound();
            }
            if (ball.y + ball.size > canvas.height) {
                ball.y = canvas.height - ball.size;
                ball.dy = -Math.abs(ball.dy);
                playWallSound();
            }

            // Ball collision with right wall
            if (ball.x + ball.size > wall.x) {
                ball.x = wall.x - ball.size;
                ball.dx = -Math.abs(ball.dx);
                playWallSound();
            }

            // Ball collision with player paddle
            if (ball.x - ball.size < player.x + player.width &&
                ball.x + ball.size > player.x &&
                ball.y > player.y &&
                ball.y < player.y + player.height &&
                ball.dx < 0) {

                ball.dx = Math.abs(ball.dx);
                ball.x = player.x + player.width + ball.size;
                ball.spin = player.velocity * 0.15;

                let hitPos = (ball.y - player.y) / player.height;
                ball.dy = (hitPos - 0.5) * 8;

                rallyCount++;
                if (speedMultiplier < maxSpeedMultiplier) {
                    speedMultiplier *= speedMultiplierIncrease;
                    speedMultiplier = Math.min(speedMultiplier, maxSpeedMultiplier);
                }

                const points = calculateHitScore();
                score += points;
                playHitSound();

                scoreDisplay.textContent = 'Score: ' + score;
                statsDisplay.textContent = `Speed: ${speedMultiplier.toFixed(2)}x | Rally: ${rallyCount}`;
            }

            // Ball goes past player
            if (ball.x < -ball.size) {
                if (activePowerUps.shield.active && activePowerUps.shield.count > 0) {
                    activePowerUps.shield.count--;
                    if (activePowerUps.shield.count === 0) {
                        activePowerUps.shield.active = false;
                    }
                    resetBall();
                    playWallSound();
                } else {
                    gameOver();
                }
            }
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawCenterLine();
            drawParticles();
            drawWall();
            drawPowerUps();
            drawPaddle();
            drawBall();
            updateMickeyPosition();
        }

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.code === 'Space') {
                e.preventDefault();
                initAudio();

                if (gameState === 'menu') {
                    gameState = 'playing';
                    startOverlay.classList.add('hidden');
                    resetGame();
                } else if (gameState === 'playing') {
                    gameState = 'paused';
                    pauseOverlay.classList.remove('hidden');
                } else if (gameState === 'paused') {
                    gameState = 'playing';
                    pauseOverlay.classList.add('hidden');
                } else if (gameState === 'gameover') {
                    gameState = 'playing';
                    gameoverOverlay.classList.add('hidden');
                    resetGame();
                }
            }

            if (gameState === 'playing') {
                if (e.key === 'ArrowUp') player.dy = -8;
                if (e.key === 'ArrowDown') player.dy = 8;
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                player.dy = 0;
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (gameState === 'playing') {
                const rect = canvas.getBoundingClientRect();
                const mouseY = e.clientY - rect.top;
                player.y = mouseY - player.height / 2;
            }
        });

        // Initialize
        displayHighScores('start-high-scores');
        updateHighScoreDisplay();
        gameLoop();
    </script>
</body>
</html>
